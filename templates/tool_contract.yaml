name: example-http-api
version: 0.1.0
description: HTTP API wrapper for external customer reads
owner: team@example.com
capabilities:
  - name: read_customer
    type: external
    allowed_inputs:
      customer_id: string
    allowed_outputs:
      customer_profile: object
    side_effects: none
    risk: high
    preconditions:
      authenticated: true
      approved_roles: [operator, admin]
