version: '3.8'

services:
  repair:
    image: node:18
    container_name: tfx-repair
    working_dir: /app
    volumes:
      - .:/app
    command: >
      sh -c "
        echo 'Running Docker Safe Repair...' &&
        mkdir -p packages/contractor-app &&
        mkdir -p packages/customer-app &&
        mkdir -p packages/ams-app &&
        mkdir -p packages/members-app &&
        echo 'Repair Complete inside Docker'
      "
