# Prometheus configuration for TFX Hub monitoring
# Install: docker run -p 9090:9090 -v $(pwd)/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml prom/prometheus
#
# Access: http://localhost:9090

global:
  scrape_interval: 15s       # Default scrape interval
  evaluation_interval: 15s   # Default eval interval
  external_labels:
    monitor: 'tfx-hub'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']

rule_files:
  - 'alert_rules.yml'

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # TFX Hub API server
  - job_name: 'tfx-hub-api'
    static_configs:
      - targets: ['localhost:3000']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Node Exporter (system metrics)
  - job_name: 'node'
    static_configs:
      - targets: ['localhost:9100']

  # PostgreSQL (if using postgres_exporter)
  - job_name: 'postgres'
    static_configs:
      - targets: ['localhost:9187']

  # Docker containers (if using cAdvisor)
  - job_name: 'docker'
    static_configs:
      - targets: ['localhost:8080']
