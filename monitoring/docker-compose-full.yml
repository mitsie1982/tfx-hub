version: '3.8'

services:
  # Prometheus time-series database
  prometheus:
    image: prom/prometheus:latest
    container_name: tfxhub-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus_real.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus_alerts_real.yml:/etc/prometheus/rules/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - monitoring
    restart: unless-stopped

  # Grafana visualization
  grafana:
    image: grafana/grafana:latest
    container_name: tfxhub-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: changeme
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    networks:
      - monitoring
    depends_on:
      - prometheus
    restart: unless-stopped

  # Alert manager
  alertmanager:
    image: prom/alertmanager:latest
    container_name: tfxhub-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - monitoring
    restart: unless-stopped

  # Node exporter (system metrics)
  node-exporter:
    image: prom/node-exporter:latest
    container_name: tfxhub-node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - monitoring
    restart: unless-stopped

  # PostgreSQL exporter (if using database)
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: tfxhub-postgres-exporter
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://user:password@postgres:5432/tfxhub?sslmode=disable"
    networks:
      - monitoring
    depends_on:
      - postgres
    restart: unless-stopped

  # PostgreSQL database
  postgres:
    image: postgres:15
    container_name: tfxhub-postgres
    environment:
      POSTGRES_DB: tfxhub
      POSTGRES_USER: tfxhub_user
      POSTGRES_PASSWORD: your-secure-password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - monitoring
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  postgres_data:

networks:
  monitoring:
    driver: bridge
