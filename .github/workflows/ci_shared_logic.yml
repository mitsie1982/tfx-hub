name: CI - Shared Logic

on:
  push:
    paths:
      - 'packages/shared-logic/**'
      - 'tests/shared-logic/**'
      - 'pnpm-workspace.yaml'
  pull_request:
    paths:
      - 'packages/shared-logic/**'
      - 'tests/shared-logic/**'
      - 'pnpm-workspace.yaml'

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Run unit tests
        run: pnpm --filter @tfx/shared-logic test

  integration:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Run integration tests
        run: pnpm --filter @tfx/shared-logic test:integration
