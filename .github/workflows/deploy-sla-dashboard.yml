name: Deploy SLA Dashboard

on:
  workflow_dispatch:

jobs:
  deploy-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Deploy Azure Workbook
        run: |
          az monitor workbook create \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name "TFX Hub SLA Dashboard" \
            --location ${{ secrets.AZURE_LOCATION }} \
            --display-name "TFX Hub SLA Dashboard" \
            --source-id ${{ secrets.AZURE_APP_INSIGHTS_ID }} \
            --definition @scripts/sla_dashboard_azure.json
