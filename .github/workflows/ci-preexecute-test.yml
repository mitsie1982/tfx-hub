name: CI PreExecute Test

on:
  workflow_dispatch:
  push:
    branches: [ chore/verify-full-pipeline-setup ]

jobs:
  preexecute-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip pwsh bash
      - name: Run preExecute flow test
        run: |
          python3 scripts/test_preexecute_flow.py
