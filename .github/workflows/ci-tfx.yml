name: TFX CI - TFMA gating and image build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE: gcr.io/my-gcp-project/tfx-model
  IMAGE_TAG: ${{ github.sha }}
  TFMA_OUTPUT_DIR: tfma-output

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker auth for GCR
        uses: docker/login-action@v2
        with:
          registry: gcr.io
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tfx tensorflow-data-validation tensorflow-model-analysis

      - name: Run TFDV (data validation)
        run: |
          mkdir -p tfdv-output
          # adapt input path to your dataset
          echo "Running TFDV (placeholder)"; true

      - name: Run TFMA evaluation (produce metrics)
        run: |
          mkdir -p ${{ env.TFMA_OUTPUT_DIR }}
          # Run your TFMA evaluation here and write metrics to ${{ env.TFMA_OUTPUT_DIR }}
          echo '{"overall": {"accuracy": 0.95, "auc": 0.90}}' > ${{ env.TFMA_OUTPUT_DIR }}/tfma_metrics.json

      - name: Run TFMA gating
        env:
          TFMA_THRESHOLDS: '{"accuracy": 0.90, "auc": 0.85}'
        run: |
          python scripts/tfma_gate.py --tfma-dir ${{ env.TFMA_OUTPUT_DIR }}

      - name: Build Docker image
        run: |
          docker build -t "${{ env.IMAGE }}:${{ env.IMAGE_TAG }}" .
          docker push "${{ env.IMAGE }}:${{ env.IMAGE_TAG }}"

