name: CI - Security Checks

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'e2e/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.pre-commit-config.yaml'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  security_checks:
    runs-on: ubuntu-latest
    name: Security Scanning

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for secret scanning

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run dependency audit
        run: pnpm audit --audit-level=moderate || echo "⚠️ Vulnerabilities found - review required"
        continue-on-error: true

      - name: Setup pre-commit
        run: |
          pip install pre-commit
          pre-commit install

      - name: Run pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure
        continue-on-error: true

      - name: Detect secrets
        run: |
          pip install detect-secrets
          detect-secrets scan --baseline .secrets.baseline --all-files || echo "⚠️ Potential secrets detected"
        continue-on-error: true

      - name: Run ESLint
        run: pnpm --filter @tfx/shared-auth run lint 2>/dev/null || echo "⚠️ Linting issues found"
        continue-on-error: true

      - name: Validate YAML configs
        run: |
          pip install yamllint
          yamllint .github/workflows/* .pre-commit-config.yaml || echo "⚠️ YAML validation issues"
        continue-on-error: true

  dependency_scanning:
    runs-on: ubuntu-latest
    name: Dependency Vulnerability Check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: NPM Audit (blocking for high/critical)
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=high
        continue-on-error: true

  secret_scanning:
    runs-on: ubuntu-latest
    name: Secret Detection

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified --no-update --no-verification
        continue-on-error: true

  commit_lint:
    runs-on: ubuntu-latest
    name: Commit Message Validation

    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commits
        uses: wagoid/commitlint-github-action@v5
        with:
          configFile: .commitlintrc.json
        continue-on-error: true
