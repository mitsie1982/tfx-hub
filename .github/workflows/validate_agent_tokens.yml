name: Validate Agent Tokens

on:
  push:
    paths:
      - 'out/agent_tokens.json'
      - 'scripts/validate_agent_tokens.py'
  pull_request:
    paths:
      - 'out/agent_tokens.json'
      - 'scripts/validate_agent_tokens.py'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate agent tokens
        run: |
          python scripts/validate_agent_tokens.py