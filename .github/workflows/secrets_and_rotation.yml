name: Secret Scanning and Key Rotation Reminder

on:
  schedule:
    - cron: '0 8 * * 1' # Every Monday at 08:00 UTC
  push:
    branches: [ chore/verify-full-pipeline-setup ]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run detect-secrets scan
        run: |
          pip install detect-secrets
          detect-secrets scan --all-files

  key-rotation-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Key rotation reminder
        run: |
          echo "REMINDER: Review and rotate secrets/keys in .env and cloud providers if needed."
