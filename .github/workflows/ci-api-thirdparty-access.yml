name: CI – API Third-Party Access

on:
  push:
    paths:
      - 'services/backend/src/routes/api_keys.js'
      - 'services/backend/src/middleware/api_gateway.js'
      - 'services/backend/src/server.js'
      - 'docs/openapi.yaml'
      - 'developer_portal/sdk/node/**'
      - 'docs/DEVELOPER_ONBOARDING.md'
      - '.github/workflows/ci-api-thirdparty-access.yml'
  pull_request:
    paths:
      - 'services/backend/src/routes/api_keys.js'
      - 'services/backend/src/middleware/api_gateway.js'
      - 'services/backend/src/server.js'
      - 'docs/openapi.yaml'
      - 'developer_portal/sdk/node/**'
      - 'docs/DEVELOPER_ONBOARDING.md'
      - '.github/workflows/ci-api-thirdparty-access.yml'

jobs:
  backend-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: |
          if [ -f package.json ] && npm run | grep -q lint; then npm run lint; else echo "No lint script"; fi
      - name: Test API key endpoints
        run: |
          node ../../scripts/test_api_keys.js

  sdk-node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: developer_portal/sdk/node
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install dependencies
        run: |
          if [ -f package.json ]; then npm install; else echo "No package.json"; fi
      - name: Run SDK example
        run: node example.js || echo "Example requires running backend and valid API key"

  openapi-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate OpenAPI spec
        uses: char0n/swagger-editor-validate@v1
        with:
          files: docs/openapi.yaml
