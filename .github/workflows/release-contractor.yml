name: Release TFX Hub Contractor

on:
  workflow_dispatch:
  push:
    tags:
      - 'release/*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Build Android artifact
        run: |
          ./scripts/build-android.sh contractor release
      - name: Build iOS artifact (placeholder)
        run: |
          ./scripts/build-ios.sh contractor
      - name: Build Windows artifact (placeholder)
        run: |
          pwsh ./scripts/build-windows.ps1 -App contractor
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contractor-artifacts
          path: |
            apps/contractor-app/android/app/build/outputs/**/*.apk
            apps/contractor-app/ios/build/**/*.ipa
            spikes/windows/contractor-msix/**/*.msix
